<!DOCTYPE html>
<html>
<head>
  <title>Hello World</title>
  <style>
  body {
    background: white;
    color: black;
  }

  h1 {
    font-size: 32px;
  }
</style>
</head>

<body>
  <h1 id="message">Loading...</h1>

  <script>
    fetch('https://hello-world-ztwf.onrender.com/')
      .then(response => response.text())
      .then(data => {
        document.getElementById('message').textContent = data;
      });
  </script>
</body>
</html>
